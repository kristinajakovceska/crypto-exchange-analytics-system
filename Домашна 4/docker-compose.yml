services:
  ta:
    image: kristinajakovcheska/ta:latest
    build: ./services/ta_service
    ports:
      - "8001:8001"
    volumes:
      - ./cryptos.db:/app/cryptos.db

  forecast:
    image: kristinajakovcheska/forecast:latest
    build: ./services/forecast_service
    ports:
      - "8002:8002"
    volumes:
      - ./cryptos.db:/app/cryptos.db

  sentiment:
    image: kristinajakovcheska/sentiment:latest
    build: ./services/sentiment_service
    ports:
      - "8003:8003"
    volumes:
      - ./cryptos.db:/app/cryptos.db

  main_app:
    image: kristinajakovcheska/main_app:latest
    build: ./main_app
    ports:
      - "8000:8000"
    environment:
      TA_URL: "http://ta:8001"
      FORECAST_URL: "http://forecast:8002"
      SENTIMENT_URL: "http://sentiment:8003"
      PORT: "8000"
    depends_on:
      - ta
      - forecast
      - sentiment
    volumes:
      - ./cryptos.db:/app/cryptos.db
